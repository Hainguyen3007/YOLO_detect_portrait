# --------------------------
# 1. InferenceService (KServe)
# --------------------------
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: yolo-fastapi
  namespace: kserve-inference
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    containers:
      - name: yolo-container
        image: docker.io/hainguyen0730/yolo-portrait:latest   # 🔥 thay bằng image thật trên Docker Hub
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
        command: ["uvicorn"]
        args: ["run:app", "--host", "0.0.0.0", "--port", "8000"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"

---
# --------------------------
# 2. Service NodePort (direct access)
# --------------------------
apiVersion: v1
kind: Service
metadata:
  name: yolo-fastapi-direct
  namespace: kserve-inference
spec:
  selector:
    serving.kserve.io/inferenceservice: yolo-fastapi
    component: predictor
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort
